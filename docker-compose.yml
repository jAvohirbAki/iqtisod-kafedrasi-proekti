services:
  postgres:
    image: postgres:16-alpine
    container_name: kafedra_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kafedra_db
    ports:
      - "5432:5432"
    volumes:
      - kafedra_pgdata:/var/lib/postgresql/data

volumes:
  kafedra_pgdata:
